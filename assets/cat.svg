<svg xmlns="http://www.w3.org/2000/svg" width="960" height="110" viewBox="0 0 960 110" role="img" aria-labelledby="title desc">
<title id="title">A little walking cat</title><desc id="desc">A mauve cat wanders toward yarn. Adapted from AsleepX/homepage-cat, MIT license.</desc>
<style>.walk{animation:walk 18s ease-in-out infinite}.leg-a{animation:step .75s ease-in-out infinite alternate;transform-origin:30px 29px}.leg-b{animation:step .75s ease-in-out -.75s infinite alternate;transform-origin:30px 29px}.tail{animation:sway 2s ease-in-out infinite alternate;transform-origin:18px 31px}.heart{animation:heart 4s ease-in-out infinite}@keyframes walk{0%,12%{transform:translateX(160px)}55%,70%{transform:translateX(650px)}71%{transform:translateX(778px) scaleX(-1)}99%,100%{transform:translateX(288px) scaleX(-1)}}@keyframes step{to{transform:rotate(12deg)}}@keyframes sway{to{transform:rotate(13deg)}}@keyframes heart{50%{opacity:.25;transform:translateY(-4px)}}@media(prefers-reduced-motion:reduce){.walk,.leg-a,.leg-b,.tail,.heart{animation:none!important}.walk{transform:translateX(400px)}}</style>
<path d="M20 89H940" stroke="#ddced3" stroke-dasharray="2 9"/><g transform="translate(0 10)"><g class="walk"><g transform="scale(2)"><g fill="none" stroke="#a38796" stroke-width="3.6" stroke-linecap="round"><path class="leg-b" d="M20 28Q24 33 21 39M43 28Q46 34 44 39"/><path class="leg-a" d="M20 28Q16 33 18 39M43 28Q42 34 44 39"/></g><path class="tail" d="M13 31C5 34 10 40 22 39C30 39 39 39 44 36" fill="none" stroke="#a38796" stroke-width="3.5" stroke-linecap="round"/><g fill="#a38796"><path d="M11 31C10 23 16 18 25 18C33 18 36 22 43 23C48 24 50 29 46 34C42 40 16 40 11 36Q9 34 11 31Z"/><path transform="translate(0 5)" d="M40 23L40 14Q40 11 42 12L46 16Q48 16 50 17L54 14Q56 13 56 16L56 23Q58 25 55 27C51 31 43 30 40 26Z"/></g><circle cx="51" cy="27" r="1.1" fill="#fbf7f4"/><path d="M43 20q-5-7-8-2 0 5 8 2 7-7 9-1-2 4-9 1" fill="#d9b8c2"/></g></g></g><g stroke="#b69aa8" fill="#eadce3" stroke-width="1.3"><circle cx="843" cy="75" r="13"/><path d="M832 69q15-8 18 15M834 84q4-15 18-12M833 76q10-6 17 7M855 81q21 17 36 3" fill="none"/></g><path class="heart" d="M870 40c-9-8-14 3 0 8 14-5 9-16 0-8" fill="#d8b7c1"/></svg>
