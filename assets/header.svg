<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" role="img" aria-labelledby="title desc">
<title id="title">Ananta</title><desc id="desc">Cream stationery with a sleepy bunny, bow and drifting petals.</desc>
<style>.petal{animation:drift 9s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.breathe{animation:breathe 4s ease-in-out infinite;transform-origin:780px 243px}.spark{animation:twinkle 5s ease-in-out infinite}@keyframes drift{50%{transform:translate(4px,-9px) rotate(12deg)}}@keyframes breathe{50%{transform:scale(1,1.018)}}@keyframes twinkle{50%{opacity:.3}}@media(prefers-reduced-motion:reduce){.petal,.breathe,.spark{animation:none!important}}</style>
